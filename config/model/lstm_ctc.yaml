# @package _global_

module:
  _target_: emg2qwerty.lightning_lstm.LSTMCTCModule

  # Same as baseline frontend:
  # freq * channels = (n_fft // 2 + 1) * 16
  in_features: 528
  mlp_features: [384]

  # Recurrent encoder params
  lstm_hidden_size: 256
  lstm_num_layers: 2
  bidirectional: true
  dropout: 0.1

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]
